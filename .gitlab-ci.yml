image: mcr.microsoft.com/playwright:v1.54.2-noble

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

stages:
  - test

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  APP_BASE_URL: "http://localhost:3000"
  API_BASE_URL: "http://localhost:3000"

cache:
  - key: "test-deps-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  - key: "app-$CI_COMMIT_REF_SLUG"
    paths:
      - /tmp/juice-shop/node_modules/
    policy: pull-push

run_tests:
  stage: test
  script:
    - echo "Start preparing app for testing..."
    - git clone https://github.com/niks-xz/my-juice-shop.git /tmp/juice-shop
    - cd /tmp/juice-shop
    - npm install
    - npm run start &
    - echo "Installing dependencies for testing..."
    - cd $CI_PROJECT_DIR
    - npm ci
    - npm run test
  artifacts:
    when: always
    paths:
      - allure-results/
      - test-results/
    expire_in: 1 hour
